[pytest]
testpaths = tests
pythonpath = .
# I test che contano davvero avviano l'app intera (streamlit.testing): ognuno
# ricostruisce la pagina da capo, e sono loro a fare il tempo — in fila
# quattro minuti, che su una correzione di due righe scoraggiano dal
# lanciarli. Girano in processi separati e non si toccano fra loro, quindi si
# distribuiscono sui core: un minuto scarso.
# ⚠️ La distribuzione è quella predefinita (test per test), NON «loadfile»:
# provata, tre minuti — un solo file ne contiene un terzo e diventa la strada
# più lunga, mentre gli altri worker stanno a guardare.
addopts = -n auto
