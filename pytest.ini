[pytest]
testpaths = tests
pythonpath = .
# I test girano in processi separati e non si toccano fra loro, quindi si
# distribuiscono sui core. Serviva quando avviavano il programma vecchio
# intero (streamlit.testing, quattro minuti in fila); col banco durano
# pochi secondi, ma distribuiti restano i più veloci da lanciare.
# ⚠️ La distribuzione è quella predefinita (test per test), NON «loadfile».
addopts = -n auto
