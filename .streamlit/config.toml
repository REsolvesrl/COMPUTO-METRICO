# Mondo «Campionario» (vedi DESIGN.md): i materiali del campionario edile.
# Ardesia e ottone vengono dal logo RESolve — qui sono la pietra e il metallo.
[theme]
base = "dark"
primaryColor = "#C9A96A"                 # ottone: azioni e accenti
backgroundColor = "#1A2744"              # ardesia: il banco di lavoro
secondaryBackgroundColor = "#243352"     # ardesia chiara: il campione rialzato
textColor = "#ECE7DA"                    # travertino: il testo
font = "sans serif"

[server]
# Quando il codice cambia, l'app si ricarica DA SOLA. Senza questo Streamlit
# si limita a mostrare il cartello «File change · Rerun» e resta ferma finché
# non lo premi: si finisce per guardare una versione vecchia convinti di
# provare quella nuova, e a inseguire difetti già corretti.
runOnSave = true

[global]
# All'apertura di un progetto le sue caselle si riscrivono nello stato di
# sessione (vedi il caricamento in streamlit_app.py): è l'unico modo di far
# adottare al browser i valori nuovi. Streamlit lo segnala con un avviso
# lungo nella finestra nera, che è innocuo ma sembra un errore — e quella
# finestra è il posto dove si guarda quando qualcosa non va.
disableWidgetStateDuplicationWarning = true
